<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Exam Performance Predictor</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #4e54c8, #8f94fb);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", sans-serif;
        }

        .glass-card {
            width: 650px;
            padding: 40px 50px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
            color: white;
            animation: fadeIn 1s ease-in-out;
        }

        h1, legend {
            text-align: center;
            font-weight: 700;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 36px;
        }

        legend {
            font-size: 22px;
            margin-bottom: 25px;
        }

        label {
            font-weight: 500;
            font-size: 16px;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px;
            font-size: 16px;
        }

        .btn-custom {
            margin-top: 10px;
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease-in-out;
        }

        .btn-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.45);
        }

        .prediction-box {
            margin-top: 25px;
            padding: 18px;
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            font-size: 22px;
            text-align: center;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>

</head>

<body>

<div class="glass-card">

    <h1><i class="bi bi-bar-chart-line"></i> Student Exam Performance</h1>
    <legend>Predict your Maths Score</legend>

    <form action="{{ url_for('predict_datapoint') }}" method="post">

        <div class="mb-3">
            <label>Gender</label>
            <select class="form-select" name="gender" required>
                <option selected disabled value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Race or Ethnicity</label>
            <select class="form-select" name="ethnicity" required>
                <option selected disabled value="">Select Ethnicity</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Parental Level of Education</label>
            <select class="form-select" name="parental_level_of_education" required>
                <option selected disabled value="">Select Parent Education</option>
                <option value="associate's degree">Associate's Degree</option>
                <option value="bachelor's degree">Bachelor's Degree</option>
                <option value="high school">High School</option>
                <option value="master's degree">Master's Degree</option>
                <option value="some college">Some College</option>
                <option value="some high school">Some High School</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Lunch Type</label>
            <select class="form-select" name="lunch" required>
                <option selected disabled value="">Select Lunch Type</option>
                <option value="free/reduced">Free/Reduced</option>
                <option value="standard">Standard</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Test Preparation Course</label>
            <select class="form-select" name="test_preparation_course" required>
                <option selected disabled value="">Select Course Status</option>
                <option value="none">None</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Reading Score (0 - 100)</label>
            <input class="form-control" type="number" name="reading_score" min="0" max="100" required>
        </div>

        <div class="mb-3">
            <label>Writing Score (0 - 100)</label>
            <input class="form-control" type="number" name="writing_score" min="0" max="100" required>
        </div>

        <button class="btn btn-light btn-custom w-100" type="submit">
            <i class="bi bi-magic"></i> Predict Maths Score
        </button>
    </form>

    {% if results %}
    <div class="prediction-box">
        <i class="bi bi-star-fill"></i> Prediction: {{ results }}
    </div>
    {% endif %}

</div>

</body>
</html>
