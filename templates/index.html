<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: "Segoe UI", sans-serif;
            margin: 0;
        }

        .welcome-box {
            text-align: center;
            padding: 40px 60px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            margin-top: 10px;
            opacity: 0.9;
        }

        .btn-custom {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 10px;
        }

    </style>

</head>

<body>

<div class="welcome-box">
    <h1>Welcome to the Home Page</h1>
    <p>Your journey into data and prediction starts here.</p>

    <a href="/predictdata" class="btn btn-light btn-custom">
        Go to Prediction Page
    </a>
</div>

</body>
</html>
